[package]
name = "schwarzschild-rt"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Schwarzschild null-geodesic ray tracer with a Keplerian accretion disk: FANTASY order-2 symplectic integration on SIMD, scalar and CUDA backends"
publish = false

[[bin]]
name = "schwarzschild-rt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.8"
rayon = "1"
wide = "0.7"
cudarc = { version = "0.16", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading"] }
libloading = { version = "0.8", optional = true }

[features]
default = []
# GPU backend: compiles the FANTASY kernel with NVRTC at start-up. Needs libcuda (the driver) and
# libnvrtc (CUDA toolkit or the NVRTC redistributable) at run time, nothing at build time.
# Enable exactly one of `cuda-12` (binds the CUDA 12.0 driver API; any 12.x driver serves it) or
# `cuda-11` (CUDA 11.8 API); `cuda` alone has no API version and does not build.
cuda = ["dep:cudarc", "dep:libloading"]
cuda-12 = ["cuda", "cudarc/cuda-12000"]
cuda-11 = ["cuda", "cudarc/cuda-11080"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
